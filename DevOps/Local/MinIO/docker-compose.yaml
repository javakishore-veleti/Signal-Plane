# Object store for payload bytes. S3 API compatible, so the same client code
# runs against Amazon S3 in the cloud.
#
# Payload bytes live here and never travel on the event bus. Retention and legal
# hold are enforced at this layer rather than in application code.

name: signal-plane-minio

services:
  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: sp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - sp-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - shared

  minio-bootstrap:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    container_name: sp-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "mc alias set local http://sp-minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
       mc mb --ignore-existing --with-lock local/${MINIO_BUCKET} &&
       mc version enable local/${MINIO_BUCKET} &&
       mc ls local"
    restart: "no"
    networks:
      - shared

volumes:
  sp-minio-data:

networks:
  shared:
    name: ${COMPOSE_NETWORK}
    external: true

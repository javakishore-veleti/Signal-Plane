# Policy store. Holds tenants, subjects, jurisdiction policy, approvals, and
# adapter registrations. In the cloud this role is served by DynamoDB; the
# repository interface is the same, which is what keeps the substrate swappable.

name: signal-plane-postgres

services:
  postgres:
    image: postgres:16-alpine
    container_name: sp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - sp-postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - shared

volumes:
  sp-postgres-data:

networks:
  shared:
    name: ${COMPOSE_NETWORK}
    external: true

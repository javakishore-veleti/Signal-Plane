# Specification driven backlog. Plan format v2.
#
# This file is the source of truth for what gets built. Tools/beads-sync.py
# projects it into the beads graph; it never reads back from beads.
#
# Levels: epic -> feature -> story -> task.
# story is a built-in beads type (persona + outcome).
# feature is a shippable capability. task is one sitting of work.
#
# Every epic, feature, and story carries spec, design, and acceptance.
# Phase 1–2 items are the open frontier. Phase 3–4 items are deferred
# so bd ready stays a real queue.
#
# key is stable. Do not renumber. Retire with status: retired.
# v1 keys E2–E7 (control-plane-shaped engineering spine) were closed as
# superseded by this product map; ADR-* keys are unchanged.

prefix: sp

decisions:
  - key: ADR-0002
    title: One normalized envelope is the integration contract
    spec: docs/adr/0002-normalized-envelope-as-integration-contract.md
    status: closed
  - key: ADR-0003
    title: One adapter per source
    spec: docs/adr/0003-adapter-per-source-not-shared-ingest.md
    status: closed
  - key: ADR-0004
    title: Authority gate precedes capture
    spec: docs/adr/0004-authority-gate-precedes-capture.md
    status: closed
  - key: ADR-0005
    title: Control plane stays off the telemetry hot path
    spec: docs/adr/0005-control-plane-off-the-telemetry-hot-path.md
    status: closed
  - key: ADR-0006
    title: Large payloads travel by reference
    spec: docs/adr/0006-blobs-by-reference-never-on-the-bus.md
    status: closed
  - key: ADR-0007
    title: Self hosted estate ships outbound only
    spec: docs/adr/0007-outbound-only-edge-shipper.md
    status: closed
  - key: ADR-0008
    title: "Federated read path, no cutover"
    spec: docs/adr/0008-federated-read-path-during-migration.md
    status: closed
  - key: ADR-0009
    title: Scoring model version pinned per tenant
    spec: docs/adr/0009-pinned-scoring-model-version-per-tenant.md
    status: closed
  - key: ADR-0010
    title: "Local first development, CDK only for cloud"
    spec: docs/adr/0010-local-first-development-cdk-for-cloud.md
    status: closed

epics:

  - key: E1
    title: Contracts and vocabulary
    priority: 0
    phase: 1
    labels: [contracts]
    spec: schemas/signal-envelope.schema.json
    design: The five contracts plus taxonomy.yaml are the published language. Everything downstream is an implementation of them.
    acceptance: "make validate passes; every adapter manifest cross-checks the taxonomy; contract tests cover determinism, hash chaining, and fail closed."
    features:
      - key: E1.F1
        title: Normalized envelope and shared construction library
        implements: [ADR-0002]
        spec: schemas/signal-envelope.schema.json
        design: "Adapters build records only through AdapterContext so identity, hashing, and authority checks cannot drift."
        acceptance: No adapter can emit a record without an unexpired decision; signal_id is deterministic; hash chain is per subject.
        stories:
          - key: E1.F1.S1
            title: Integrator emits only the normalized envelope
            status: closed
            spec: schemas/signal-envelope.schema.json
            design: Heterogeneity stops at the adapter. Consumers never see a source-specific shape.
            acceptance: A directory_watch event validates against signal-envelope.schema.json with no additional properties.
            tasks:
              - { key: E1.F1.S1.T1, title: Define signal envelope schema, status: closed }
              - { key: E1.F1.S1.T2, title: Implement AdapterContext build and hashing, status: closed }
              - { key: E1.F1.S1.T3, title: Reject additional properties and unknown signal types at validation, status: closed }
          - key: E1.F1.S2
            title: Replay of the same source event collapses to one record
            status: closed
            spec: schemas/signal-envelope.schema.json
            design: "signal_id is uuid5 of tenant|adapter|native_id so overlap during migration does not double count."
            acceptance: Two builds with the same native_id produce the same signal_id.
            tasks:
              - { key: E1.F1.S2.T1, title: "Deterministic v5 signal_id over tenant, adapter, native id", status: closed }
              - { key: E1.F1.S2.T2, title: Contract test for id determinism, status: closed }
          - key: E1.F1.S3
            title: Investigator can detect omitted records without trusting the store
            status: closed
            spec: schemas/signal-envelope.schema.json
            design: "Per-subject content hash chain. Integrity is evidential, not decorative."
            acceptance: Consecutive signals for one subject link; a second subject starts a new chain.
            tasks:
              - { key: E1.F1.S3.T1, title: Per subject hash chain in AdapterContext, status: closed }
              - { key: E1.F1.S3.T2, title: Contract test for chain linkage and per-subject isolation, status: closed }
          - key: E1.F1.S4
            title: Capture is refused without an unexpired authority decision
            spec: schemas/signal-envelope.schema.json
            design: "Fail closed. Missing or expired authority is a defect, not a configuration choice."
            acceptance: build() raises PermissionError when authority is absent or expired.
            tasks:
              - { key: E1.F1.S4.T1, title: Refuse emit without authority, status: closed }
              - { key: E1.F1.S4.T2, title: Refuse emit after expiry, status: closed }
              - { key: E1.F1.S4.T3, title: Treat missing expires_at as expired in is_expired }
      - key: E1.F2
        title: Governed vocabulary
        implements: [ADR-0002]
        spec: taxonomy.yaml
        design: "Additive only within a schema_version. An unmapped event is a decision, not an unclassified record."
        acceptance: A manifest with an unknown signal_type or invalid category fails CI; a taxonomy addition alone does not.
        stories:
          - key: E1.F2.S1
            title: Release is blocked when an adapter invents a signal type
            spec: taxonomy.yaml
            design: Vocabulary governance is mechanical. AR-04 / R1.
            acceptance: validate.py exits non-zero on an unknown signal_type.
            tasks:
              - { key: E1.F2.S1.T1, title: Cross check manifests against taxonomy, status: closed }
              - { key: E1.F2.S1.T2, title: Fail validation when PyYAML is absent rather than skipping }
          - key: E1.F2.S2
            title: Integrator cannot emit an unclassified record
            spec: taxonomy.yaml
            design: "FR-1.8. Gap is declared; the event is diverted or rejected, never stored as other."
            acceptance: Handler that cannot map an event records a declared gap and does not call build().
            tasks:
              - { key: E1.F2.S2.T1, title: Unmapped event path in shared library }
              - { key: E1.F2.S2.T2, title: Contract test that unclassified emit is impossible }
          - key: E1.F2.S3
            title: Removing a signal type requires a new schema_version and an ADR
            spec: taxonomy.yaml
            design: FR-1.3. Repurposing a key is a breaking change.
            acceptance: docs/ describes the bump procedure with a worked example.
            tasks:
              - { key: E1.F2.S3.T1, title: Schema version bump procedure }
      - key: E1.F3
        title: Authority decision contract
        implements: [ADR-0004]
        spec: schemas/authority-decision.schema.json
        design: Bounded permission. Capture mode names the approver. Jurisdiction follows the subject. Unbounded grants are invalid.
        acceptance: Schema requires expires_at; capture_mode and approver.role enums match persisted policy values.
        stories:
          - key: E1.F3.S1
            title: A decision without expiry cannot be issued
            spec: schemas/authority-decision.schema.json
            design: "ADR-0004. expires_at is required, including on denials, so caches always have a bound."
            acceptance: JSON Schema validation fails when expires_at is absent.
            tasks:
              - { key: E1.F3.S1.T1, title: Require expires_at in authority-decision.schema.json, status: closed }
              - { key: E1.F3.S1.T2, title: Control plane deny path always stamps expires_at }
          - key: E1.F3.S2
            title: Persisted capture modes match the contract enums
            spec: schemas/authority-decision.schema.json
            design: Uppercase seed values would fail runtime validation and block the gate.
            acceptance: Seed data and schema both use passive_metadata and friends.
            tasks:
              - { key: E1.F3.S2.T1, title: Align SQL seed capture_mode with schema, status: closed }
          - key: E1.F3.S3
            title: Persisted approver roles match the contract enums
            spec: schemas/authority-decision.schema.json
            design: Approver mapping is the gate. Case mismatch is a silent deny-all or deny-none.
            acceptance: "Seed approvals use subject, employer, works_council."
            tasks:
              - { key: E1.F3.S3.T1, title: Align SQL seed approver with schema, status: closed }
      - key: E1.F4
        title: Payload reference contract
        implements: [ADR-0006]
        spec: schemas/blob-reference.schema.json
        design: "Bulk never rides the bus. Write bytes first, publish the reference second."
        acceptance: blob-reference.schema.json is complete; envelope payload_ref $ref resolves.
        stories:
          - key: E1.F4.S1
            title: "A record carries a reference, never the bytes"
            spec: schemas/blob-reference.schema.json
            design: FR-5.2. Retention has one enforcement point.
            acceptance: Envelope with inline bytes fails schema validation.
            tasks:
              - { key: E1.F4.S1.T1, title: "Blob reference schema fields: uri, hash, media_type, bytes, retention, hold, key, estate" }
              - { key: E1.F4.S1.T2, title: Envelope payload_ref uses the blob schema }
          - key: E1.F4.S2
            title: A reference to absent content cannot be published
            spec: schemas/blob-reference.schema.json
            design: Orphans are recoverable; dangling refs are not.
            acceptance: Shared library refuses to attach payload_ref before the write ack.
            tasks:
              - { key: E1.F4.S2.T1, title: Adapter blob helper writes then returns the reference }
              - { key: E1.F4.S2.T2, title: "Test: no payload_ref if write fails" }
      - key: E1.F5
        title: Adapter manifest contract
        implements: [ADR-0003]
        spec: schemas/adapter-manifest.schema.json
        design: Coverage is derived from manifests. An inaccurate manifest produces confidently wrong coverage.
        acceptance: "Manifest schema requires emits, capture_modes, delivery, identifier kinds; CI validates it."
        stories:
          - key: E1.F5.S1
            title: Integrator declares capability before shipping
            spec: schemas/adapter-manifest.schema.json
            design: "FR-2.2. Coverage discovery reads this, not tribal knowledge."
            acceptance: A manifest missing capture_modes or emits fails validate.
            tasks:
              - { key: E1.F5.S1.T1, title: Manifest required fields and enums }
              - { key: E1.F5.S1.T2, title: directory_watch manifest validates }
          - key: E1.F5.S2
            title: Identifier kinds on the manifest drive subject resolution
            spec: schemas/adapter-manifest.schema.json
            design: The control plane must not guess which identifiers an adapter will send.
            acceptance: Coverage for a subject includes only adapters whose identifier kinds can bind.
            tasks:
              - { key: E1.F5.S2.T1, title: identifier_kinds on manifest schema }
              - { key: E1.F5.S2.T2, title: Registry rejects a manifest with empty identifier_kinds }
      - key: E1.F6
        title: Generated contract models for portals
        spec: Portals/README.md
        design: "Types are generated from Contracts/schemas so a contract change is a compile error, not a runtime surprise."
        acceptance: Fresh clone of admin-portal and client-portal builds without a codegen step; generated output is committed.
        stories:
          - key: E1.F6.S1
            title: Portal compile fails when the envelope schema changes incompatibly
            spec: Portals/README.md
            design: Shared library owns generation. Hand-written TS models are prohibited.
            acceptance: Changing a required envelope field breaks portal CI.
            tasks:
              - { key: E1.F6.S1.T1, title: Codegen from JSON Schema into Portals/shared }
              - { key: E1.F6.S1.T2, title: Commit generated models }
              - { key: E1.F6.S1.T3, title: CI check that generated output is not stale }

  - key: E2
    title: Collection authority
    priority: 0
    phase: 2
    labels: [control-plane, java, governance]
    spec: schemas/authority-decision.schema.json
    design: Deny by default. Mode determines the approver. Jurisdiction follows the subject. Every grant is bounded. Every denial is actionable.
    acceptance: subject-0002 in DE is denied continuous_screen with a reason naming the jurisdiction; subject-0001 in US-NC is granted with expires_at.
    features:
      - key: E2.F1
        title: Persisted jurisdictional policy
        implements: [ADR-0004]
        spec: DevOps/Local/Postgres/init/01-schema.sql
        design: "Policy lives in the store, not in code. JDBC repository is tenant-scoped; a query without tenant does not compile."
        acceptance: Integration test seeds both demo subjects and asserts grant and denial against a real database.
        stories:
          - key: E2.F1.S1
            title: "Administrator's grant is evaluated against stored policy, not a stub"
            spec: docs/PRD.md
            design: "UC3 / FR-4.1. E2.F1.T2 of the old plan: JDBC PolicyRepository."
            acceptance: "AuthorityGate.evaluate reads jurisdiction_policy, subject, and approval tables."
            tasks:
              - { key: E2.F1.S1.T1, title: JDBC PolicyRepository implementation }
              - { key: E2.F1.S1.T2, title: Tenant predicate required on every query }
              - { key: E2.F1.S1.T3, title: Integration test against local Postgres seed }
          - key: E2.F1.S2
            title: Policy version on the decision is the version that was applied
            spec: schemas/authority-decision.schema.json
            design: "FR-4.2, NFR-4.4. Retroactive policy change does not rewrite history."
            acceptance: Granted decision.policy_version equals jurisdiction_policy.policy_version at evaluation time.
            tasks:
              - { key: E2.F1.S2.T1, title: Stamp policy_version from the row used }
              - { key: E2.F1.S2.T2, title: Changing policy does not alter previously issued decision rows }
      - key: E2.F2
        title: Capture mode and subject jurisdiction
        implements: [ADR-0004]
        spec: schemas/authority-decision.schema.json
        design: Approver is a function of mode and optional jurisdiction override. Tenant HQ is irrelevant.
        acceptance: DE subject cannot use a US-NC employer grant; works_council override is honoured.
        stories:
          - key: E2.F2.S1
            title: Investigator in DE is not captured at continuous_screen without works-council approval
            spec: docs/PRD.md
            design: UC3. Governing rule follows the subject.
            acceptance: "evaluate(tenant-demo, subject-0002, continuous_screen) returns granted=false and names DE."
            tasks:
              - { key: E2.F2.S1.T1, title: "Load subject.jurisdiction, not tenant country" }
              - { key: E2.F2.S1.T2, title: Denial reason includes jurisdiction and mode }
          - key: E2.F2.S2
            title: Works-council override replaces the mode default approver
            spec: schemas/authority-decision.schema.json
            design: DE permitted_modes is passive_metadata only; approver_override is works_council.
            acceptance: Approval from employer is ignored when override is works_council.
            tasks:
              - { key: E2.F2.S2.T1, title: JurisdictionPolicy.approverFor uses override when set }
              - { key: E2.F2.S2.T2, title: "Test: employer approval does not satisfy DE override" }
      - key: E2.F3
        title: Bounded grant
        implements: [ADR-0004]
        spec: schemas/authority-decision.schema.json
        design: Every granted decision has expires_at. max_lifetime_seconds on the policy is the bound.
        acceptance: No granted decision lacks expiry. Cache lifetime cannot exceed the decision.
        stories:
          - key: E2.F3.S1
            title: Administrator receives a time-bounded grant for a permitted mode
            spec: docs/PRD.md
            design: FR-4.5. US-NC subject-0001 passive_metadata with employer approval.
            acceptance: granted=true and expires_at = evaluated_at + max_lifetime_seconds.
            tasks:
              - { key: E2.F3.S1.T1, title: Compute expires_at from policy max_lifetime_seconds }
              - { key: E2.F3.S1.T2, title: "Reject granted && expires_at == null in AuthorityDecision constructor" }
          - key: E2.F3.S2
            title: Adapter stops emitting when the cached grant expires
            spec: Middleware/adapters/common/authority.py
            design: "NFR-1.1 converse: in-flight collection continues only while the decision is unexpired."
            acceptance: "After expiry, the next build() raises and no envelope is produced."
            tasks:
              - { key: E2.F3.S2.T1, title: Adapter session cache stores expires_at }
              - { key: E2.F3.S2.T2, title: is_expired fail-closed when expires_at missing }
      - key: E2.F4
        title: Actionable denial
        implements: [ADR-0004]
        spec: schemas/authority-decision.schema.json
        design: A denial nobody can explain is indistinguishable from a bug and gets worked around.
        acceptance: Every denial has denial_reason an administrator can act on; HTTP 200 with granted=false.
        stories:
          - key: E2.F4.S1
            title: Administrator can act on a denial without reading source code
            spec: docs/PRD.md
            design: "FR-4.6. Reasons name missing approval, missing jurisdiction, or mode not permitted."
            acceptance: Each deny branch in AuthorityGate has a distinct reason string covering the cause.
            tasks:
              - { key: E2.F4.S1.T1, title: Denial for unresolved jurisdiction }
              - { key: E2.F4.S1.T2, title: Denial for no policy on file }
              - { key: E2.F4.S1.T3, title: Denial for no approval on record }
          - key: E2.F4.S2
            title: Caller does not retry a denial as if it were a 5xx
            spec: Middleware/control-plane/src/main/java/io/signalplane/controlplane/authority/AuthorityController.java
            design: A denial is a well-formed answer.
            acceptance: POST /v1/authority/decisions returns 200 and granted=false.
            tasks:
              - { key: E2.F4.S2.T1, title: Controller returns 200 for denials }
              - { key: E2.F4.S2.T2, title: Adapter raises AuthorityDenied and does not retry }
      - key: E2.F5
        title: Decision constraints
        implements: [ADR-0004]
        spec: schemas/authority-decision.schema.json
        design: "Schedule windows, excluded categories, excluded destinations, redaction profile travel with the grant."
        acceptance: A grant outside a window is unusable; excluded destinations are never captured.
        stories:
          - key: E2.F5.S1
            title: Collection is closed outside the permitted schedule window
            spec: docs/PRD.md
            design: "FR-4.7, UC4. Session termination is rule driven."
            acceptance: A decision with weekday windows refuses emit on Sunday.
            tasks:
              - { key: E2.F5.S1.T1, title: Stamp schedule_windows from policy onto the decision }
              - { key: E2.F5.S1.T2, title: Adapter refuses emit outside the window }
          - key: E2.F5.S2
            title: Banking and health destinations are never captured regardless of tenant config
            spec: schemas/authority-decision.schema.json
            design: FR-4.12. Jurisdictional never-collect list.
            acceptance: "Payload or metadata destined to *.bank.example is dropped even with a grant."
            tasks:
              - { key: E2.F5.S2.T1, title: Stamp excluded_destinations from jurisdiction_policy }
              - { key: E2.F5.S2.T2, title: Adapter filters excluded destinations before build }
      - key: E2.F6
        title: Revocation within the decision lifetime
        implements: [ADR-0004]
        spec: schemas/authority-decision.schema.json
        design: Withdrawal takes effect within the cached TTL. Shortening TTL increases control-plane load. This is a designed bound.
        acceptance: Revoking approval stops capture within max_lifetime_seconds.
        stories:
          - key: E2.F6.S1
            title: Works council withdraws approval and capture stops before the next TTL
            spec: docs/PRD.md
            design: FR-4.10. Adapters do not refresh a revoked decision.
            acceptance: "After approval row is deleted, a new evaluate returns denied; in-flight session dies at expiry."
            tasks:
              - { key: E2.F6.S1.T1, title: Delete approval invalidates new evaluates immediately }
              - { key: E2.F6.S1.T2, title: Document revocation latency as the decision lifetime }
      - key: E2.F7
        title: Decision audit trail
        implements: [ADR-0004]
        spec: schemas/authority-decision.schema.json
        design: "Every decision, granted or denied, is persisted with its inputs."
        acceptance: "A decision_id resolves to policy version, approver, inputs, and outcome."
        stories:
          - key: E2.F7.S1
            title: Compliance owner traces a stored record to the decision that permitted it
            spec: docs/PRD.md
            design: "UC6, FR-4.8, FR-4.11."
            acceptance: "GET /v1/authority/decisions/{id} returns the full decision including inputs."
            tasks:
              - { key: E2.F7.S1.T1, title: Persist every evaluate result }
              - { key: E2.F7.S1.T2, title: Lookup API by decision_id }

  - key: E3
    title: Subject identity
    priority: 0
    phase: 2
    labels: [control-plane, java, governance]
    spec: schemas/signal-envelope.schema.json
    design: Raw identifiers resolve to a canonical subject with confidence. Ambiguity resolves to no subject. Correction is auditable and retroactive. Erasure spans estates.
    acceptance: "Conflicting claims produce unresolved + diagnostic, never a silent merge. SAR retrieve and erase work across managed and self-hosted estates subject to hold."
    features:
      - key: E3.F1
        title: Identifier to canonical subject
        spec: schemas/signal-envelope.schema.json
        design: "UPN, email, device id, account SID, employee number are claims, not the subject."
        acceptance: "A known mapping returns subject_id and confidence; unknown returns unresolved, not a new person guessed from email."
        stories:
          - key: E3.F1.S1
            title: "Investigator's query by email finds the same subject as a query by device id"
            spec: docs/PRD.md
            design: "UC2, FR-3.1."
            acceptance: Two identifier kinds for subject-0001 resolve to the same subject_id.
            tasks:
              - { key: E3.F1.S1.T1, title: subject_identifier table lookup }
              - { key: E3.F1.S1.T2, title: Confidence scored mapping API }
          - key: E3.F1.S2
            title: Ambiguous claims do not invent a person
            spec: docs/PRD.md
            design: "FR-3.2, AR-08. Silent merge is the identity failure that matters."
            acceptance: Email mapped to two subject_ids returns unresolved and a diagnostic event.
            tasks:
              - { key: E3.F1.S2.T1, title: Conflict detection across identifier rows }
              - { key: E3.F1.S2.T2, title: "Diagnostic on unresolved, no subject_id issued" }
      - key: E3.F2
        title: Auditable correction
        spec: docs/PRD.md
        design: Mappings are correctable. Correction reapplies across stored records.
        acceptance: An administrator can split a merged identity; subsequent reads use the corrected subject.
        stories:
          - key: E3.F2.S1
            title: Administrator splits a wrong merge and history follows
            spec: docs/PRD.md
            design: FR-3.3.
            acceptance: "After correction, records previously under subject A for identifier X appear under subject B."
            tasks:
              - { key: E3.F2.S1.T1, title: Correction ledger with actor and reason }
              - { key: E3.F2.S1.T2, title: Reindex affected signal_id subject pointers }
      - key: E3.F3
        title: Subject access and erasure
        spec: docs/PRD.md
        design: "Retrievable and deletable by canonical subject across sources and estates, hold taking precedence."
        acceptance: SAR export contains all estates; erase is refused while held and completes when hold lifts.
        stories:
          - key: E3.F3.S1
            title: Subject receives everything the platform holds about them
            spec: docs/PRD.md
            design: "NFR-4.2, FR-3.4."
            acceptance: Export job returns index rows and payload refs for one subject_id from every estate.
            tasks:
              - { key: E3.F3.S1.T1, title: SAR export job across federated read }
              - { key: E3.F3.S1.T2, title: Include authority provenance in the export }
          - key: E3.F3.S2
            title: Subject erasure is refused while a legal hold applies
            spec: docs/PRD.md
            design: Hold is storage-layer enforcement.
            acceptance: "DELETE subject is 409 while hold is on; after hold release, index and blobs are gone."
            tasks:
              - { key: E3.F3.S2.T1, title: Hold check before erase }
              - { key: E3.F3.S2.T2, title: "Erase across index, blobs, and identifier maps" }

  - key: E4
    title: Sessions and coverage
    priority: 0
    phase: 2
    labels: [control-plane, java]
    spec: docs/architecture.md
    design: "Coverage is derived from registered manifests. Sessions terminate on a rule: schedule, expiry, retention, or case closure. Explicit close is the exception."
    acceptance: "Coverage for a subject lists adapters, fidelity, and modes. A session outside its window is closed without an operator."
    features:
      - key: E4.F1
        title: Adapter registry
        implements: [ADR-0003]
        spec: schemas/adapter-manifest.schema.json
        design: Registration is how coverage becomes a derived answer.
        acceptance: Registered manifests are queryable by adapter_id and version; seed.py is idempotent.
        stories:
          - key: E4.F1.S1
            title: Integrator registers a manifest and it becomes visible to coverage
            spec: docs/PRD.md
            design: FR-2.3.
            acceptance: POST /v1/adapters then GET coverage includes the new adapter.
            tasks:
              - { key: E4.F1.S1.T1, title: Adapter registration API and store }
              - { key: E4.F1.S1.T2, title: Idempotent upsert on adapter_id+version }
      - key: E4.F2
        title: Coverage discovery
        spec: docs/PRD.md
        design: "Which sources can observe this subject, at what fidelity, under which modes \u2014 from manifests, not tribal knowledge."
        acceptance: "Given an identifier, coverage lists adapters whose identifier_kinds and capture_modes apply."
        stories:
